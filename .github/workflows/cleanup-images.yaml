name: Inspect and clean old GHCR images

on:
  push:
    branches: [maintenance/ghcr-cleanup]
    paths: ['.github/workflows/cleanup-images.yaml', 'scripts/cleanup-ghcr.py']
  workflow_dispatch:

concurrency:
  group: ghcr-cleanup
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CLEANUP_APPLY: 'false'
      KEEP_IMAGE_REVISIONS: '0960e9f14e86,3c40910065e9'
      EXPECTED_CURRENT_TAG: 'git-0960e9f14e86'
    steps:
      - uses: actions/checkout@v5
      - name: Inspect retained manifests and generate a cleanup plan
        run: python3 scripts/cleanup-ghcr.py
      - name: Apply the exact plan and verify retained manifests
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          import subprocess

          path = Path('artifacts/ghcr-cleanup-audit.json')
          plan = json.loads(path.read_text())
          Path('artifacts/ghcr-cleanup-plan.json').write_text(path.read_text())
          env = {
              **os.environ,
              'CLEANUP_APPLY': 'true',
              'REVIEWED_DELETE_IDS': ','.join(str(item['id']) for item in plan['delete']),
              'EXPECTED_CURRENT_DIGEST': plan['current_digest'],
          }
          subprocess.run(['python3', 'scripts/cleanup-ghcr.py'], env=env, check=True)
          PYTHON
      - name: Keep inventory and cleanup audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghcr-cleanup-audit
          path: artifacts/ghcr-cleanup*.json
          retention-days: 7
