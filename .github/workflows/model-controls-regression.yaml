name: Model controls save regression

on:
  push:
    branches: [fix/model-control-save-regression]

permissions:
  contents: read

jobs:
  tests:
    name: Chat regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CYPRESS_INSTALL_BINARY: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install locked frontend dependencies
        run: npm ci --force
      - name: Install an isolated test DOM without changing locked app dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/test-dom" --no-package-lock --ignore-scripts --no-audit --no-fund jsdom@26.1.0
          ln -s "$RUNNER_TEMP/test-dom/node_modules/jsdom" node_modules/jsdom
      - name: Verify tested editor and Svelte versions match the Docker build lockfile
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          for (const name of ['@tiptap/core', '@tiptap/starter-kit', '@tiptap/extension-link', '@tiptap/pm', 'svelte']) {
            const path = `node_modules/${name}`;
            const installed = JSON.parse(readFileSync(`${path}/package.json`, 'utf8')).version;
            assert.equal(installed, lock.packages[path].version, name);
            console.log(`${name}: ${installed}`);
          }
          JS
      - name: Test defaults and component wiring without a project build
        run: node tests/fork/chat-defaults.node.mjs
      - name: Generate SvelteKit TypeScript configuration on the CI runner
        run: npx svelte-kit sync
      - name: Test real editor paste, serialization and read-only code rendering
        run: |
          mkdir -p artifacts
          npx vitest run --config vitest.fork.config.ts --reporter=verbose --reporter=junit --outputFile=artifacts/fork-tests.xml
      - name: Verify original Markdown styling and read-only CodeMirror in Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-test" --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.56.1
          ln -s "$RUNNER_TEMP/browser-test/node_modules/playwright" node_modules/playwright
          "$RUNNER_TEMP/browser-test/node_modules/.bin/playwright" install --with-deps chromium
          node tests/fork/browser-regression.mjs
      - name: Retain regression test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-regression-results
          path: artifacts/
          if-no-files-found: ignore

